<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08677b"><meta name="description" content="Discover words with a treasure hunt. See, listen, practise and review at your own pace.">
  <title>LexiTrek — Treasure Voyage</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to learning</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#trail" aria-label="LexiTrek home"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 6 25 19 20 34 15 19Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg></span><span>Lexi<span class="brand-light">Trek</span><small>WORDS TAKE YOU PLACES</small></span></a>
      <div class="nav-label">YOUR VOYAGE</div>
      <nav id="navigation"></nav>
      <div class="sidebar-note"><span class="small-compass">✧</span><strong>One clue at a time.</strong><p>Discover, practise, return.</p><div class="tiny-mountains" aria-hidden="true"></div></div>
      <div class="sidebar-bottom"><button id="teacher-open" class="subtle-button">Teacher settings</button><span>FORM 2 · DEVELOPMENT BUILD</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">My voyage <span>/</span> <strong id="page-label">Treasure map</strong></div><div class="top-actions"><span id="connection" class="connection"><i></i> Connected</span><button id="profile-switch" class="profile-button" aria-label="Learner profiles"></button></div></header>
      <main id="main" tabindex="-1"><div class="loading"><span class="loader"></span> Preparing your voyage…</div></main>
      <footer><span>Made for small steps and lasting learning.</span><span id="save-status">Progress stays on this device</span></footer>
    </div>
  </div>
  <dialog id="task-dialog" class="task-dialog" aria-labelledby="task-title"></dialog>
  <dialog id="profile-dialog" class="panel-dialog" aria-labelledby="profile-title"></dialog>
  <dialog id="teacher-dialog" class="panel-dialog wide-dialog" aria-labelledby="teacher-title"></dialog>
  <dialog id="offline-dialog" class="panel-dialog" aria-labelledby="offline-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="restore-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./app.js"></script>
</body>
</html>
